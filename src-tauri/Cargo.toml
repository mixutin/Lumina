[package]
name = "lumina"
version = "0.1.0-alpha.1"
description = "A Steam-free Linux launcher experience for Zenless Zone Zero"
authors = ["Lumina contributors"]
edition = "2021"
license = "MIT"
homepage = "https://mixutin.github.io/Lumina/"
repository = "https://github.com/mixutin/Lumina"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = [] }
